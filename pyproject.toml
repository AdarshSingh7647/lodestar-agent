[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-agent-manager"
version = "0.1.0"
description = "Persistent memory, approval policy and verification gate for coding-agent harnesses"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mgr = "mgr.cli:main"

[tool.setuptools.packages.find]
include = ["mgr*"]
