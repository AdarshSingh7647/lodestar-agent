<!doctype html>
<html><head><meta charset="utf-8"><title>Lodestar</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#fafafa;color:#222;max-width:1100px}
h2{margin-top:28px;border-bottom:1px solid #ddd;padding-bottom:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid #e5e5e5;padding:6px;text-align:left;vertical-align:top}
.tag{padding:2px 8px;border-radius:10px;background:#eee;font-size:12px}
.open{background:#dbeafe}.done,.done_unverified{background:#dcfce7}.needs_human{background:#fee2e2}
button{cursor:pointer;margin:2px}input{padding:4px;margin:2px}
pre{white-space:pre-wrap;margin:0;font-size:12px}
</style></head>
<body>
<h1>🧭 Lodestar</h1>
<div id="status">connecting...</div>

<h2>Batch questions</h2>
<div id="questions"></div>
<div>
  <input id="qtext" size="50" placeholder="Question text">
  <input id="qopts" size="30" placeholder="Options, comma separated">
  <button onclick="addQuestion()">Add question</button>
</div>

<h2>Tasks</h2><div id="tasks"></div>
<h2>Memory (active)</h2><div id="memories"></div>
<h2>Recent events</h2><div id="events"></div>

<script>
const token = new URLSearchParams(location.search).get('t') || '';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: {'X-Mgr-Token': token, 'Content-Type': 'application/json'},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

function table(cols, rows) {
  return '<table><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>' + rows.join('') + '</table>';
}

async function load() {
  try {
    const s = await api('/api/state');
    document.getElementById('status').textContent =
      `${s.tasks.length} tasks, ${s.memories.length} active memories, ${s.events.length} recent events`;

    const pending = s.questions.filter(q => q.answer === null);
    document.getElementById('questions').innerHTML = pending.length ? pending.map(q => {
      const opts = JSON.parse(q.options || '[]');
      const btns = opts.map(o => `<button onclick="answer(${q.id}, '${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('');
      return `<div><b>${esc(q.text)}</b> ${btns}</div>`;
    }).join('') : '<i>No pending questions.</i>';

    document.getElementById('tasks').innerHTML = table(
      ['#', 'Title', 'Status', 'Rounds', 'Last result'],
      s.tasks.map(t => `<tr><td>${t.id}</td><td>${esc(t.title)}</td>
        <td><span class="tag ${esc(t.status)}">${esc(t.status)}</span></td>
        <td>${t.rounds}/${t.max_rounds}</td><td><pre>${esc((t.last_result || '').slice(0, 400))}</pre></td></tr>`));

    document.getElementById('memories').innerHTML = table(
      ['#', 'Scope', 'Kind', 'Content', ''],
      s.memories.map(m => `<tr><td>${m.id}</td><td>${esc(m.scope)}${m.project ? '<br><small>' + esc(m.project) + '</small>' : ''}</td>
        <td>${esc(m.kind)}</td><td>${esc(m.content)}</td>
        <td><button onclick="forget(${m.id})">Forget</button></td></tr>`));

    document.getElementById('events').innerHTML = table(
      ['#', 'Time', 'Kind', 'Payload'],
      s.events.map(e => `<tr><td>${e.id}</td><td>${new Date(e.ts * 1000).toLocaleTimeString()}</td>
        <td>${esc(e.kind)}</td><td><pre>${esc(e.payload.slice(0, 300))}</pre></td></tr>`));
  } catch (e) {
    document.getElementById('status').textContent = 'Error: ' + e.message + ' (check the ?t= token in the URL)';
  }
}

async function answer(id, value) { await api('/api/answer', {id, answer: value}); load(); }
async function forget(id) { await api('/api/forget', {id}); load(); }
async function addQuestion() {
  const text = document.getElementById('qtext').value.trim();
  const options = document.getElementById('qopts').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!text) return;
  await api('/api/questions', {batch: 'ui', questions: [{text, options}]});
  document.getElementById('qtext').value = ''; document.getElementById('qopts').value = '';
  load();
}
load(); setInterval(load, 3000);
</script>
</body></html>
